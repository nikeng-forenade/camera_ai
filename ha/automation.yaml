# Home Assistant: automation that on Reolink motion takes a snapshot, saves it
# in HA, and sends it to Camera AI for analysis.
#
# Setup:
#   1. Create the folder /config/www/snapshots once (File editor / SSH).
#      Images are then visible at http://<HA-IP>:8123/local/snapshots/
#   2. Replace the entity names and IPs below:
#      - binary_sensor.<reolink>_motion  → your Reolink motion sensor
#      - camera.<reolink>                → your Reolink camera entity
#      - <HA-IP>                         → HA IP as seen from the LXC
#
# After it runs, Home Assistant gets (via MQTT discovery + this request):
#   - binary_sensor.camera_ai_motion        (ON when people/cars/animals seen)
#   - sensor.camera_ai_last_detection       (classes + confidence)
#   - sensor.camera_ai_scene_description    (Swedish summary, e.g. "Jag ser 1 bil och 1 katt.")
#   - image.camera_ai_snapshot              (annotated image)
alias: "Camera AI — Analysera rörelsebild"
trigger:
  platform: state
  entity_id: binary_sensor.reolink_front_motion
  to: "on"
action:
  - service: camera.snapshot
    target:
      entity_id: camera.reolink_front
    data:
      filename: /config/www/snapshots/latest.jpg
  - service: rest_command.camera_ai_analyze
    data:
      url: "http://<HA-IP>:8123/local/snapshots/latest.jpg"
mode: single

# ---------------------------------------------------------------------------
# VERSION 2 (rekommenderas): "LLM Vision"-flöde mot Camera AI-servern.
# camera_ai.analyze_camera fotograferar + analyserar och returnerar resultatet
# via response_variable. Hoppar av om inget intressant, annars Telegram.
# Kräver: telegram_bot-konfiguration och att integrationen är tillagd.
# ---------------------------------------------------------------------------
alias: "Camera AI — Rörelse → analys → Telegram"
trigger:
  - platform: state
    entity_id: binary_sensor.garden_person
    to: "on"
  - platform: state
    entity_id: binary_sensor.garden_vehicle
    to: "on"
action:
  - service: camera_ai.analyze_camera
    data:
      camera_entity: camera.garden
    response_variable: analysis
  - if:
      - condition: template
        value_template: "{{ (analysis.counts.people + analysis.counts.vehicles + analysis.counts.animals) == 0 }}"
    then:
      - stop: "Inget intressant"
    else:
      - service: telegram_bot.send_photo
        data:
          url: "{{ analysis.annotated_url }}"
          caption: "Detektion på garden! {{ analysis.summary }}"
      - service: telegram_bot.send_message
        data:
          message: "{{ analysis.summary }} ({{ analysis.counts.people }} pers, {{ analysis.counts.vehicles }} bilar)"
mode: single

# Gemensamma YOLO-modeller för tjänsterna nedan.
# YOLO26 (n/s/m/l/x) listas först med kort vägledning, YOLO11 finns kvar som alternativ.

analyze_camera:
  name: Analyze camera
  description: >-
    Takes a snapshot of a camera, sends it to the Camera AI server and updates
    the entities. Returns the result (detections, counts, summary, annotated
    image URL) so automations can use it via response_variable.
  fields:
    camera_entity:
      name: Camera entity
      description: Camera to snapshot (e.g. camera.camera_ai_backyard_live or your Reolink camera).
      required: false
      selector:
        entity:
          domain: camera
    use_llm:
      name: Use LLM description
      description: Send the image to the server's vision LLM for a description.
      required: false
      selector:
        boolean:
    model:
      name: YOLO model
      description: Model to use (overrides the server's active model).
      required: false
      selector:
        select:
          options:
            - label: "yolo26n.pt · snabbast / många kameror (2.4M, mAP 40.9)"
              value: yolo26n.pt
            - label: "yolo26s.pt · ⭐ bra balans (9.5M, mAP 48.6)"
              value: yolo26s.pt
            - label: "yolo26m.pt · bättre precision (20.4M, mAP 53.1)"
              value: yolo26m.pt
            - label: "yolo26l.pt · tung (24.8M, mAP 55.0)"
              value: yolo26l.pt
            - label: "yolo26x.pt · max precision (55.7M, mAP 57.5)"
              value: yolo26x.pt
            - yolo11n.pt
            - yolo11s.pt
            - yolo11m.pt
            - yolo11l.pt
            - yolo11x.pt
    confidence:
      name: Confidence
      description: Detection confidence threshold (0.05–0.95).
      required: false
      selector:
        number:
          min: 0.05
          max: 0.95
          step: 0.05
    prompt:
      name: LLM prompt
      description: Custom prompt for the vision LLM (overrides the configured one).
      required: false
      selector:
        text:
          multiline: true


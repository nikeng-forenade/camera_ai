analyze_camera:
  name: Analyze camera
  description: Takes a snapshot of a camera, sends it to the Camera AI server and updates the entities.
  fields:
    camera_entity:
      name: Camera entity
      description: Camera to snapshot (defaults to the configured one).
      required: false
      selector:
        entity:
          domain: camera
    model:
      name: YOLO model
      description: Overrides the configured model for this analysis.
      required: false
      selector:
        select:
          options:
            - yolo11n.pt
            - yolo11s.pt
            - yolo11m.pt
            - yolo11l.pt
            - yolo11x.pt
    confidence:
      name: Confidence
      description: Detection confidence threshold (0.05–0.95).
      required: false
      selector:
        number:
          min: 0.05
          max: 0.95
          step: 0.05

analyze_url:
  name: Analyze URL
  description: Analyzes an image at a URL with the Camera AI server and updates the entities.
  fields:
    url:
      name: Image URL
      description: URL of the image (e.g. http://<HA-IP>:8123/local/snapshots/latest.jpg).
      required: true
      selector:
        text:
    model:
      name: YOLO model
      description: Overrides the configured model for this analysis.
      required: false
      selector:
        select:
          options:
            - yolo11n.pt
            - yolo11s.pt
            - yolo11m.pt
            - yolo11l.pt
            - yolo11x.pt
    confidence:
      name: Confidence
      description: Detection confidence threshold (0.05–0.95).
      required: false
      selector:
        number:
          min: 0.05
          max: 0.95
          step: 0.05

describe_image:
  name: Describe image (server LLM)
  description: >-
    Skickar en bild till Camera AI-serverns vision-LLM och returnerar en svensk
    beskrivning ('summary'/'description'). Ge antingen 'camera_entity' (en kamera
    vars snapshot skickas) eller 'url' till en bild. Resultatet kan användas i
    automations via response_variable och sparas även i sensorn 'Scene
    description'.
  fields:
    camera_entity:
      name: Camera entity
      description: Kamera att fotografera och skicka till LLM:en (t.ex. camera.camera_ai_*_live).
      required: false
      selector:
        entity:
          domain: camera
    url:
      name: Image URL
      description: URL till en bild som servern hämtar och skickar till LLM:en.
      required: false
      selector:
        text:
    model:
      name: YOLO model
      description: Detektionsmodell som används innan LLM-beskrivningen.
      required: false
      selector:
        select:
          options:
            - label: "yolo26n.pt · snabbast / många kameror (2.4M, mAP 40.9)"
              value: yolo26n.pt
            - label: "yolo26s.pt · ⭐ bra balans (9.5M, mAP 48.6)"
              value: yolo26s.pt
            - label: "yolo26m.pt · bättre precision (20.4M, mAP 53.1)"
              value: yolo26m.pt
            - label: "yolo26l.pt · tung (24.8M, mAP 55.0)"
              value: yolo26l.pt
            - label: "yolo26x.pt · max precision (55.7M, mAP 57.5)"
              value: yolo26x.pt
            - yolo11n.pt
            - yolo11s.pt
            - yolo11m.pt
            - yolo11l.pt
            - yolo11x.pt
    confidence:
      name: Confidence
      description: Detektionskonfidens (0.05–0.95).
      required: false
      selector:
        number:
          min: 0.05
          max: 0.95
          step: 0.05
    prompt:
      name: LLM prompt
      description: Överskriver serverns prompt för vision-LLM:en.
      required: false
      selector:
        text:
          multiline: true

set_config:
  name: Set server config
  description: >-
    Changes runtime settings on the Camera AI server (model, confidence, device,
    LLM model/prompt, keep-alive) — takes effect immediately, no restart needed.
  fields:
    model:
      name: YOLO model
      description: YOLO model to use.
      required: false
      selector:
        select:
          options:
            - label: "yolo26n.pt · snabbast / många kameror (2.4M, mAP 40.9)"
              value: yolo26n.pt
            - label: "yolo26s.pt · ⭐ bra balans (9.5M, mAP 48.6)"
              value: yolo26s.pt
            - label: "yolo26m.pt · bättre precision (20.4M, mAP 53.1)"
              value: yolo26m.pt
            - label: "yolo26l.pt · tung (24.8M, mAP 55.0)"
              value: yolo26l.pt
            - label: "yolo26x.pt · max precision (55.7M, mAP 57.5)"
              value: yolo26x.pt
            - yolo11n.pt
            - yolo11s.pt
            - yolo11m.pt
            - yolo11l.pt
            - yolo11x.pt
    confidence:
      name: Confidence
      description: Detection confidence threshold (0.05–0.95).
      required: false
      selector:
        number:
          min: 0.05
          max: 0.95
          step: 0.05
    device:
      name: Inference device
      description: CPU, Intel Arc (openvino:GPU) or NVIDIA CUDA (0).
      required: false
      selector:
        select:
          options:
            - cpu
            - openvino:GPU
            - "0"
    use_llm:
      name: Use LLM description
      description: Enable the vision LLM description.
      required: false
      selector:
        boolean:
    llm_model:
      name: LLM model (Ollama)
      description: Vision LLM to use, e.g. moondream.
      required: false
      selector:
        text:
    prompt:
      name: LLM prompt
      description: Prompt sent to the vision LLM.
      required: false
      selector:
        text:
          multiline: true
    keep_alive:
      name: Keep LLM in memory
      description: >-
        How long to keep the vision LLM loaded — -1 = always in memory (fast),
        0 = unload immediately (saves VRAM), otherwise seconds.
      required: false
      selector:
        select:
          options:
            - "-1"
            - "0"
            - "300"
            - "600"
            - "1800"
            - "3600"

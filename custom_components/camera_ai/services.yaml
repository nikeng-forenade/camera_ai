analyze_camera:
  name: Analyze camera
  description: >-
    Takes a snapshot of a camera, sends it to the Camera AI server and updates
    the entities. Returns the result (detections, counts, summary, annotated
    image URL) so automations can use it via response_variable.
  fields:
    camera_entity:
      name: Camera entity
      description: Camera to snapshot (defaults to the configured one).
      required: false
      selector:
        entity:
          domain: camera
    model:
      name: YOLO model
      description: Overrides the configured model for this analysis.
      required: false
      selector:
        select:
          options:
            - yolo11n.pt
            - yolo11s.pt
            - yolo11m.pt
            - yolo11l.pt
            - yolo11x.pt
    confidence:
      name: Confidence
      description: Detection confidence threshold (0.05–0.95).
      required: false
      selector:
        number:
          min: 0.05
          max: 0.95
          step: 0.05
    prompt:
      name: LLM prompt
      description: Custom prompt for the vision LLM (overrides the configured one).
      required: false
      selector:
        text:
          multiline: true

analyze_url:
  name: Analyze URL
  description: >-
    Analyzes an image at a URL with the Camera AI server and updates the
    entities. Returns the result so automations can use it via response_variable.
  fields:
    url:
      name: Image URL
      description: URL of the image (e.g. http://<HA-IP>:8123/local/snapshots/latest.jpg).
      required: true
      selector:
        text:
    model:
      name: YOLO model
      description: Overrides the configured model for this analysis.
      required: false
      selector:
        select:
          options:
            - yolo11n.pt
            - yolo11s.pt
            - yolo11m.pt
            - yolo11l.pt
            - yolo11x.pt
    confidence:
      name: Confidence
      description: Detection confidence threshold (0.05–0.95).
      required: false
      selector:
        number:
          min: 0.05
          max: 0.95
          step: 0.05
    prompt:
      name: LLM prompt
      description: Custom prompt for the vision LLM (overrides the configured one).
      required: false
      selector:
        text:
          multiline: true

set_config:
  name: Set server config
  description: >-
    Changes runtime settings on the Camera AI server (model, confidence, device,
    LLM model/prompt, keep-alive) — takes effect immediately, no restart needed.
  fields:
    model:
      name: YOLO model
      description: YOLO model to use.
      required: false
      selector:
        select:
          options:
            - yolo11n.pt
            - yolo11s.pt
            - yolo11m.pt
            - yolo11l.pt
            - yolo11x.pt
    confidence:
      name: Confidence
      description: Detection confidence threshold (0.05–0.95).
      required: false
      selector:
        number:
          min: 0.05
          max: 0.95
          step: 0.05
    device:
      name: Inference device
      description: CPU, Intel Arc (openvino:GPU) or NVIDIA CUDA (0).
      required: false
      selector:
        select:
          options:
            - cpu
            - openvino:GPU
            - "0"
    use_llm:
      name: Use LLM description
      description: Enable the vision LLM description.
      required: false
      selector:
        boolean:
    llm_model:
      name: LLM model (Ollama)
      description: Vision LLM to use, e.g. moondream.
      required: false
      selector:
        text:
    prompt:
      name: LLM prompt
      description: Prompt sent to the vision LLM.
      required: false
      selector:
        text:
          multiline: true
    keep_alive:
      name: Keep LLM in memory
      description: >-
        How long to keep the vision LLM loaded — -1 = always in memory (fast),
        0 = unload immediately (saves VRAM), otherwise seconds.
      required: false
      selector:
        select:
          options:
            - "-1"
            - "0"
            - "300"
            - "600"
            - "1800"
            - "3600"


<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Camera AI — Test GUI</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">🎥</span>
      <div>
        <h1>Camera AI</h1>
        <p>Upload a picture → YOLO detects objects → small LLM describes the scene</p>
      </div>
    </div>
    <div class="status-wrap">
      <div class="status" id="status"><span class="dot"></span> checking…</div>
      <div class="status" id="haStatus"><span class="dot"></span> HA checking…</div>
    </div>
  </header>

  <main>
    <!-- Settings -->
    <section class="card settings">
      <h2>⚙️ Settings</h2>
      <div class="settings-grid">
        <label>YOLO model
          <select id="model">
            <option value="yolo11n.pt">yolo11n.pt (nano — fastest)</option>
            <option value="yolo11s.pt">yolo11s.pt (small)</option>
            <option value="yolo11m.pt">yolo11m.pt (medium)</option>
          </select>
        </label>
        <label>Confidence <span id="confValue">0.35</span>
          <input type="range" id="conf" min="0.05" max="0.95" step="0.05" value="0.35" />
        </label>
        <label>
          <input type="checkbox" id="useLlm" checked />
          Ask the small vision LLM to describe the scene
        </label>
        <label>
          <input type="checkbox" id="useHa" checked />
          Send results to Home Assistant
        </label>
        <label class="wide">LLM prompt
          <input type="text" id="prompt" value="Svara på svenska med EN kort mening om vad du ser: bara personer, bilar och djur, med antal. Exempel: 'Jag ser 2 personer, 1 bil och 1 katt.' Ser du inget av detta, svara 'Jag ser inget av intresse.' Nämn inget annat." />
        </label>
      </div>
    </section>

    <!-- Dropzone -->
    <section class="card">
      <div class="dropzone" id="dropzone" tabindex="0">
        <input type="file" id="fileInput" accept="image/*" multiple hidden />
        <div class="dz-inner">
          <span class="dz-icon">📤</span>
          <p><strong>Drop images here</strong> or <span class="link">click to browse</span></p>
          <p class="hint">JPG, PNG, WEBP, BMP — multiple files supported</p>
        </div>
      </div>
    </section>

    <!-- Results -->
    <section class="results" id="results"></section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
